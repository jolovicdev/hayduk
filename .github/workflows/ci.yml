name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Verify generated protocol
        run: |
          go run github.com/gzuidhof/tygo@v0.2.21 generate
          git diff --exit-code -- ui/src/protocol/types.ts

      - name: Test Go
        run: go test -race ./...

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Test UI
        working-directory: ui
        run: npm test

      - name: Build UI
        working-directory: ui
        run: npm run build

      - name: Verify embedded UI
        run: diff -qr ui/dist internal/server/dist

      - name: Build release binary
        env:
          CGO_ENABLED: 0
        run: go build -trimpath -o /tmp/hayduk ./cmd/hayduk
